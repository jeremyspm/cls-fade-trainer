<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1215">
<title>CLS Fade Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Dark teleprompter, one theme on purpose: you read it at arm's length in a bright CLS room. */
:root{
  --bg:#0c1215; --panel:#141c20; --line:#22303a; --ink:#e8eef2; --mute:#8b98a3; --dim:#4c5963;
  --acc:#7cc7e8; --ok:#46c28e; --warn:#f0b54a; --bad:#ff6b61;
  --l0:#1f2a31; --l1:#284758; --l2:#2f6a86; --l3:#3f93b8; --l4:#7cc7e8;
  --f:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:2px 0 0;font-size:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.blk{margin-top:24px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.seg button.on{background:var(--acc);color:#06141b;border-color:var(--acc);font-weight:700}
.seg.sm{margin-top:6px}.seg.sm button{padding:8px 4px;font-size:14px}
.mrow{margin-top:14px}
.mh{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}.mh b{color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px;margin-top:6px}
.cells i{aspect-ratio:1;border-radius:3px;background:var(--l0)}
.cells i.l1{background:var(--l1)}.cells i.l2{background:var(--l2)}.cells i.l3{background:var(--l3)}.cells i.l4{background:var(--l4)}
.best{font-size:13px;color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums}
.modes{display:grid;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.mode b{font-size:17px}.mode span{font-size:14px;color:var(--mute)}
.mode.hero{border-color:var(--acc);background:linear-gradient(180deg,rgba(124,199,232,.12),var(--panel))}
.scenerow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);padding:0 4px}
.scenerow select{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.opts{display:grid;gap:10px;font-size:15px}
.opts label{display:flex;gap:10px;align-items:flex-start}
.opts input{width:20px;height:20px;accent-color:var(--acc);flex:none;margin-top:1px}
.note{font-size:13px;color:var(--mute);margin:0}
.warn{color:var(--warn)}
.ghostbtn{justify-self:start;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font-size:14px}

/* session */
#sess{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);flex:none}
.where{flex:1;min-width:0}
.where b{display:block;font-size:15px}
.where span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;font-size:20px}
.prog{height:3px;background:var(--line);margin:0 14px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.stage{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.stage::before,.stage::after{content:'';flex:1 0 12vh}
.line{color:var(--dim);font-size:16px}
.line.near{color:#97a4af}
.lab{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.line.cur{color:var(--ink);font-size:clamp(21px,5.8vw,29px);line-height:1.3;font-weight:700;border-left:3px solid var(--acc);padding-left:14px;transition:border-color .15s}
.line.cur.long{font-size:clamp(17px,4.5vw,22px)}
.line.cur .lab{color:var(--acc)}
.line.partner{font-style:italic}
.who{font-style:normal;font-weight:700;color:var(--warn);margin-right:6px}
.fd{opacity:.28}
.line.cur b{color:#fff}
.line u{text-decoration-color:rgba(124,199,232,.55);text-underline-offset:4px}
.cue{color:var(--warn)}
.blank{display:inline-block;width:70%;height:1.1em;border-bottom:2px dashed var(--dim)}
.hand{margin-right:6px}
.extra{font-size:14px;font-weight:400;color:var(--mute);margin-top:10px;font-style:normal}
.extra.mist{color:var(--warn)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:rgba(255,107,97,.16);color:var(--bad);margin-bottom:6px}
.ban{color:var(--warn);font-style:normal}
.ok .line.cur{border-left-color:var(--ok)}.bad .line.cur{border-left-color:var(--bad)}
.runv{display:grid;gap:14px}
.runv .sc{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.runv .big{font-size:clamp(34px,10vw,48px);font-weight:700;line-height:1.05}
.fk{display:grid;gap:14px}
.fk .pr{font-size:clamp(26px,8vw,38px);font-weight:700;line-height:1.1;color:var(--acc)}
.fk .cueline{font-size:18px;color:var(--ink)}
.fk .prev{font-size:15px;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fk .prev small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.fk .q{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0;min-height:36px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel);color:var(--mute);border:1px solid var(--line)}
.chip.hit{background:rgba(70,194,142,.16);border-color:rgba(70,194,142,.45);color:#86e2b8}
.heard{font-size:12px;color:var(--dim);padding:6px 16px 0;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
.ctl button{padding:14px 4px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.ctl button:disabled{opacity:.35}
.mic.live{background:rgba(255,107,97,.14);border-color:var(--bad);color:#ffb7b1}
.mic.live::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:7px;vertical-align:1px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.live::before{animation:none}.prog i,.line.cur{transition:none}}

/* report */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tiles div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tiles b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tiles small{font-size:12px;color:var(--mute)}
.miss{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.miss li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:9px 12px;font-size:14px}
.miss li.skip{border-left-color:var(--bad)}
.miss small{display:block;color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.row button{flex:1;min-width:120px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.row button.pri{background:var(--acc);color:#06141b;border-color:var(--acc);font-weight:700}
.field{display:grid;gap:6px;font-size:15px}
.field small{color:var(--mute);font-size:12px;margin-left:6px}
.field input,.field select{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.note a{color:var(--acc)}
.cov{font-size:13px;padding:4px 2px;color:var(--warn)}
.missed{flex-basis:100%;font-size:14px;color:var(--warn)}
.meter{height:3px;margin:8px 16px 0;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s linear}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#2a1f12;border:1px solid var(--warn);color:#ffe2b0;border-radius:12px;padding:12px 14px;font-size:14px;z-index:9}
</style>
</head>
<body>

<main id="home" class="wrap">
  <h1>CLS Fade Trainer</h1>
  <p class="sub">Vital signs + Med admin · Monday 19 October, back to back</p>

  <section class="blk">
    <h2>Practical</h2>
    <div class="seg" id="pickScript">
      <button type="button" data-s="vs">Vital signs</button>
      <button type="button" data-s="ma">Med admin</button>
    </div>
    <div class="seg sm" id="pickDrug">
      <button type="button" data-d="draw">Draw on the day</button>
      <button type="button" data-d="para">Paracetamol</button>
      <button type="button" data-d="meto">Metoprolol</button>
    </div>
    <div id="mastery"></div>
  </section>

  <section class="blk modes">
    <h2>Practise</h2>
    <button type="button" class="mode" data-m="learn"><b>Learn</b><span>Teleprompter. Say each line out loud and it moves when it hears you.</span></button>
    <button type="button" class="mode" data-m="drill"><b>Drill</b><span>Lines fade as you earn them and come back when you fumble.</span></button>
    <div class="scenerow"><label for="scene">Drill</label><select id="scene"></select></div>
    <button type="button" class="mode" data-m="run"><b>Run</b><span>Blank screen. The whole practical, hands-free, timed.</span></button>
    <button type="button" class="mode" data-m="fork"><b>Fork drill</b><span>The 6 points where vital signs and med admin split. 10 rounds.</span></button>
    <button type="button" class="mode hero" data-m="monday"><b>Monday run</b><span>Vital signs, then med admin with a drawn drug. Back to back, like the day.</span></button>
  </section>

  <section class="blk opts">
    <h2>Settings</h2>
    <label><input type="checkbox" id="optVoice"> <span>Mr Luke and the RN read their lines out loud</span></label>
    <label><input type="checkbox" id="optMic"> <span>Voice check: only move on once you've said the line (off = tap the screen to move on)</span></label>
    <div class="field"><label for="optKey">Groq API key <small>saved on this phone only</small></label>
      <input type="password" id="optKey" autocomplete="off" spellcheck="false" placeholder="gsk_…"></div>
    <p class="note" id="engineNote"></p>
    <div class="field"><label for="optPause">Pause before it checks your line</label>
      <select id="optPause"><option value="0.7">0.7 s</option><option value="1">1 s</option><option value="1.4">1.4 s</option><option value="2">2 s</option></select></div>
    <div class="field"><label for="optNeed">How much of the line you must say</label>
      <select id="optNeed"><option value="loose">Every keyword</option><option value="normal">Every keyword + 70% of the line</option><option value="strict">Every keyword + 85% of the line</option></select></div>
    <p class="note">Practice only. No notes or devices are allowed into the med admin assessment.</p>
    <button type="button" class="ghostbtn" id="reset">Reset progress</button>
  </section>
</main>

<section id="sess" hidden>
  <div class="bar">
    <button type="button" class="x" id="quit" aria-label="End session">✕</button>
    <div class="where"><b id="sTitle"></b><span id="sScene"></span></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="prog"><i id="progFill"></i></div>
  <div class="stage" id="stage"></div>
  <div class="chips" id="chips"></div>
  <div class="meter"><i id="lvl"></i></div>
  <div class="heard" id="heard"></div>
  <div class="ctl">
    <button type="button" id="prev">◀ Back</button>
    <button type="button" id="mic" class="mic">Mic off</button>
    <button type="button" id="hint">Hint</button>
    <button type="button" id="next">Skip ▶</button>
  </div>
</section>

<main id="report" class="wrap" hidden>
  <h1 id="rTitle"></h1>
  <p class="sub" id="rSub"></p>
  <div class="tiles" id="rTiles"></div>
  <ul class="miss" id="rMiss"></ul>
  <div class="row" id="rRow"></div>
</main>

<div class="toast" id="toast" hidden></div>

<script>const DATA={"scripts":{"vs":{"label":"Vital signs","steps":[{"n":1,"kind":"say","title":"Check the chart: right patient, obs due","scene":"At the chart, with your preceptor","do":"Point to the name, date of birth and NHI on the vital signs chart. Say you’ll check them verbally and on the wristband. Look at when obs were last done.","words":"This is the adult vital signs chart for John Luke. His date of birth is here and his NHI is here. I’ll check those verbally with him and on his wristband. No one has taken his vital signs yet today, so I’ll be doing them now.","to":"the RN","mistake":"","id":"vs-1","g":["chart","Luke","date of birth|birth","NHI|n h i|2963|dgy|d g y","wristband|wrist band|\\bband"]},{"n":2,"kind":"say","title":"Say your plan and your order","scene":"At the chart, with your preceptor","do":"Temperature, then pulse, then respirations (without telling him), then blood pressure last. Document as you go, then report back.","words":"I’ll take his temperature first, then his pulse, then his respiratory rate, but I won’t tell him I’m doing that, because breathing changes if people know. Then his blood pressure last. I’ll document as I go and report the findings to you.","to":"the RN","mistake":"","id":"vs-2","g":["temperature|temp","pulse","respiratory|respirat|breathing","won’t tell|won.?t tell|not tell|without telling|let him know","blood pressure|\\bbp\\b","report"]},{"n":3,"kind":"say","title":"Get the equipment and check it works","scene":"At the chart, with your preceptor","do":"Tympanic thermometer + probe covers · manual cuff in the RIGHT SIZE (have a bigger one ready) · stethoscope · watch with a second hand · the vital signs chart · blue or black pen · wipes. Check each one actually works.","words":"I’ll just make sure everything’s in working order. I’m going to use the larger cuff on Mr Luke, but I’ve got a medium one here as well.","to":"","mistake":"","id":"vs-3","g":["working order|working","larger|bigger|large","medium"]},{"n":4,"kind":"act","title":"Hand hygiene","scene":"At the chart, with your preceptor","do":"Sanitise your hands before you go to the patient (or wash with soap and water).","words":"","to":"","mistake":"","id":"vs-4","g":["sanitising|sanitis|sanitiz|hand|wash"],"say":"I’m sanitising my hands."},{"n":5,"kind":"say","title":"Greet him warmly","scene":"At the bedside","do":"Kind, unhurried. A small check-in before the task.","words":"Good morning. How are you today?","to":"Mr Luke","mistake":"","id":"vs-5","g":["morning|hello|kia ora|\\bhi\\b|afternoon","how are you"]},{"n":6,"kind":"partner","who":"Mr Luke","words":"Oh, I’m doing okay. A little bit tired this morning.","scene":"At the bedside","id":"vs-6","audio":"vs-6"},{"n":7,"kind":"say","title":"Introduce yourself AND your preceptor","scene":"At the bedside","do":"Your name, that you’re a nursing student from MIT, and who your preceptor is.","words":"My name’s ___. I’m a second-year nursing student from MIT, and this is my preceptor ___, who I’m working with today.","to":"Mr Luke","mistake":"","id":"vs-7","g":["my name|name.?s|name is","student","MIT|\\bmit\\b|m i t|em i t","preceptor|receptor|perceptor|precept"]},{"n":8,"kind":"say","title":"ID check: full name AND date of birth","scene":"At the bedside","do":"Ask him to TELL you. Don’t say his name for him.","words":"Before we go any further, can I just make sure I’ve got the right chart and the right patient? Can you tell me your full name and date of birth, please?","to":"Mr Luke","mistake":"Saying “You’re John Luke, aren’t you?” is a closed question. He has to tell you.","id":"vs-8","g":["full name","date of birth|birth","tell me"]},{"n":9,"kind":"partner","who":"Mr Luke","words":"John Luke. Sixteenth of December, 1942.","scene":"At the bedside","id":"vs-9","audio":"vs-9"},{"n":10,"kind":"say","title":"Wristband: name, DOB AND NHI against the chart","scene":"At the bedside","do":"Ask to look at the band. Read the name, date of birth AND NHI on the band against the chart, out loud.","words":"Is it okay if I check your wristband as well? John Luke, 16th of December 1942, and NHI D G Y 2963. That matches the chart.","to":"Mr Luke","mistake":"The NHI is the one people forget. The rubric names it.","id":"vs-10","g":["wristband|wrist band|\\bband","1942|forty.?two","NHI|n h i|2963|dgy|d g y","matches|match"],"trap":"NHI is the one people forget"},{"n":11,"kind":"say","title":"Ask what he’d like to be called","scene":"At the bedside","do":"Preferred name. This is culturally safe practice and it’s a rubric line on its own.","words":"What would you like me to call you today?","to":"Mr Luke","mistake":"","id":"vs-11","g":["call you|be called|prefer"]},{"n":12,"kind":"partner","who":"Mr Luke","words":"Oh, John’s fine.","scene":"At the bedside","id":"vs-12","audio":"vs-12"},{"n":13,"kind":"say","title":"Explain: ear, wrist, arm, cuff pumped up twice","scene":"At the bedside","do":"Name the touching: the top of his ear, his wrist, his arm. The cuff goes up twice. About 10–12 minutes. Any questions?","words":"We’re going to do your vital signs. I’ll take your temperature with a thermometer that goes in your ear, so I’ll need to touch the top of your ear. I’ll take your pulse, so I’ll touch your wrist. Then your blood pressure: a cuff goes on your arm and gets pumped up. We do that twice. It’ll take about ten to twelve minutes. Any questions about that?","to":"Mr Luke","mistake":"The rubric line is literally “involves touching their ear and their arm”. Say both words.","id":"vs-13","g":["ear|\\bears?\\b","wrist","arm|\\barm\\b","twice|two times|2 times","questions|question"],"trap":"Say ear AND arm"},{"n":14,"kind":"say","title":"Ask for consent","scene":"At the bedside","do":"A clear question he can say no to.","words":"Are you happy for me to go ahead and do that now?","to":"Mr Luke","mistake":"","id":"vs-14","g":["happy|okay|\\bok\\b|alright|all right","go ahead|do that|proceed|start"]},{"n":15,"kind":"partner","who":"Mr Luke","words":"Yes, please.","scene":"At the bedside","id":"vs-15","audio":"vs-15"},{"n":16,"kind":"act","title":"Make the space safe","scene":"At the bedside","do":"Privacy (curtain) · brakes on · clear the area · him sitting comfortably with feet flat · your equipment within reach.","words":"","to":"","mistake":"","id":"vs-16","g":["curtain|privacy","brakes|brake","comfortably|comfortable|comfy|feet flat"],"say":"Curtain for privacy, brakes on, and you’re sitting comfortably with your feet flat."},{"n":17,"kind":"act","title":"Tympanic (ear) temperature","scene":"Temperature","do":"New probe cover → gently pull the top of the ear up and back → probe in snugly → press → read → eject the cover into the bin.","words":"","to":"","mistake":"","id":"vs-17","g":["probe cover|cover|probe","up and back|back"],"say":"New probe cover on, gently pulling the top of the ear up and back."},{"n":18,"kind":"act","title":"Chart it now","scene":"Temperature","do":"Straight onto the vital signs chart: mark with an X, or write the value if it’s off the scale. Date and 24-hour time at the top of the column.","words":"","to":"","mistake":"Never on a paper towel or your hand. Janine’s slide says so in those words.","id":"vs-18","g":["charting|chart|document|record|plot","temperature|temp"],"say":"Charting the temperature now with an X, date and 24-hour time at the top."},{"n":19,"kind":"act","title":"Radial pulse: 30 seconds × 2","scene":"Pulse and respirations","do":"Two or three fingers (not your thumb) on the radial pulse. Count for 30 seconds and double it. If it’s IRREGULAR, count a full minute. Feel the rhythm and strength too.","words":"","to":"","mistake":"","id":"vs-19","g":["radial|pulse","30|thirty","doubling|doubl|times two|times 2"],"say":"Radial pulse, counting for 30 seconds and doubling it."},{"n":20,"kind":"silent","title":"Respirations: keep your fingers on the wrist","scene":"Pulse and respirations","do":"Don’t announce it. Leave your fingers on his wrist and count breaths for 30 seconds × 2 (a full minute if irregular). Note depth and effort.","words":"","to":"","mistake":"If he knows you’re counting, his breathing changes.","id":"vs-20","g":["done|finished|next"],"say":"Count his breaths silently for 30 seconds × 2, fingers still on his wrist. Say “done” when you finish."},{"n":21,"kind":"act","title":"Chart HR (X) and RR (the number in its box)","scene":"Pulse and respirations","do":"Heart rate: mark with an X. Respiratory rate: write the actual number in the box.","words":"","to":"","mistake":"","id":"vs-21","g":["heart rate|pulse|\\bhr\\b","resp|breath|\\brr\\b"],"say":"Charting the heart rate with an X, and the resp rate number in its box."},{"n":22,"kind":"act","title":"Position the arm","scene":"Blood pressure: two-step","do":"Sleeve up (bare arm) · arm supported at heart level, palm up · him sitting, feet flat, not talking.","words":"","to":"","mistake":"","id":"vs-22","g":["sleeve|bare","heart level|heart","palm"],"say":"Sleeve up, arm supported at heart level, palm up."},{"n":23,"kind":"say","title":"Check the cuff size","scene":"Blood pressure: two-step","do":"Check the range lines on the cuff fit his arm. Too small reads falsely HIGH.","words":"I’m just going to measure to make sure you’ve got the right size cuff.","to":"Mr Luke","mistake":"","id":"vs-23","g":["size|measure","cuff"]},{"n":24,"kind":"say","title":"Find the brachial artery","scene":"Blood pressure: two-step","do":"Feel the brachial pulse on the inside of the elbow crease (little-finger side of the biceps tendon). Ask him to keep his arm nice and straight.","words":"I’m just finding the brachial artery here. Keep your arm nice and straight for me.","to":"","mistake":"","id":"vs-24","g":["brachial|bracial|brachia|brake ial","straight"]},{"n":25,"kind":"act","title":"Wrap the cuff","scene":"Blood pressure: two-step","do":"Cuff fully deflated. Artery marker over the brachial artery. Bottom edge about 2–3 cm above the elbow crease. Snug: two fingers fit under it.","words":"","to":"","mistake":"","id":"vs-25","g":["marker|artery|brachial","2 to 3|two to three|2-3|centimet|\\bcm\\b","fingers|finger"],"say":"Cuff fully deflated, marker over the brachial artery, 2 to 3 cm above the elbow crease, two fingers fit under."},{"n":26,"kind":"say","title":"STEP 1: feel the pulse, pump until it disappears, +30","scene":"Blood pressure: two-step","do":"Fingers on the radial (or brachial) pulse. Close the valve. Pump until the pulse disappears, then 30 mmHg more. NO stethoscope yet.","words":"I’m just going to pump it up the first time, to get an estimate of what your blood pressure is.","to":"","mistake":"","id":"vs-26","g":["pump","first","estimate"]},{"n":27,"kind":"say","title":"Let it down and note where the pulse comes back","scene":"Blood pressure: two-step","do":"Open the valve slowly. The number where you FEEL the pulse come back is the estimated systolic. (In the video: about 110.)","words":"So I got about 110. That’s what we call an approximate systolic.","to":"","mistake":"","id":"vs-27","g":["systolic","approximate|estimate|about"]},{"n":28,"kind":"act","title":"Deflate fully, then wait 30 seconds","scene":"Blood pressure: two-step","do":"Let ALL the air out. Wait 30 seconds before step 2, so the blood in his arm settles.","words":"","to":"","mistake":"Pumping straight back up is the retry spiral: the arm congests, the sounds get fainter, and every try gets harder.","id":"vs-28","g":["deflating|deflat|let it down|all the air|air out|let.*down","30|thirty","waiting|wait"],"say":"Deflating fully, and waiting 30 seconds before step 2."},{"n":29,"kind":"act","title":"STEP 2: stethoscope ON the brachial, BEFORE you pump","scene":"Blood pressure: two-step","do":"Earpieces pointing forward (towards your nose). Tap the chest piece to check it’s open. Rest it LIGHTLY on the brachial artery, below the cuff, not tucked under it.","words":"","to":"","mistake":"This is the one you were pulled up on. The stethoscope goes on FIRST. Pumping comes after.","id":"vs-29","g":["stethoscope|steth","brachial|artery","before"],"say":"Stethoscope on the brachial artery first, before I pump.","trap":"You were pulled up on this"},{"n":30,"kind":"say","title":"Pump to estimate + 30","scene":"Blood pressure: two-step","do":"Close the valve. Pump to 30 mmHg above your step-1 estimate (110 → 140).","words":"Now I’m going to pump it up to 30 above that, so up to 140.","to":"Mr Luke","mistake":"","id":"vs-30","g":["pump","30|thirty","above|more"]},{"n":31,"kind":"act","title":"Release 2–3 mmHg a second and listen","scene":"Blood pressure: two-step","do":"Turn the valve slowly so the needle falls 2–3 mmHg per second. FIRST clear tap = systolic. Keep going. Where the sound DISAPPEARS = diastolic. Then let it all down and take the cuff off.","words":"","to":"","mistake":"","id":"vs-31","g":["2 to 3|two to three|2-3|millimet|\\bmm\\b|per second|a second","first","disappears|disappear|last sound|stop|gone"],"say":"Releasing 2 to 3 mm a second, listening for the first tap, then where it disappears."},{"n":32,"kind":"say","title":"Tell him the result in plain words","scene":"Blood pressure: two-step","do":"Give the number and what it means. Ask if he knows his usual BP.","words":"That was 110 over 60. That’s normal, on the low side of normal. Do you know what your blood pressure usually is?","to":"Mr Luke","mistake":"","id":"vs-32","g":["over|\\bover\\b","normal","usually|usual"]},{"n":33,"kind":"act","title":"Chart the BP","scene":"Blood pressure: two-step","do":"An arrowhead pointing UP with its tip on the systolic, one pointing DOWN with its tip on the diastolic, joined by a dotted line. (Only the systolic scores on the EWS, but you chart both.)","words":"","to":"","mistake":"","id":"vs-33","g":["arrow","systolic","diastolic"],"say":"Charting the BP: arrow up on the systolic, arrow down on the diastolic, dotted line between."},{"n":34,"kind":"say","title":"Tell him you’ll talk to your preceptor","scene":"Report and leave him safe","do":"Include him. Don’t talk over him.","words":"John, I’m just going to talk to my preceptor about your results here. Is that okay?","to":"Mr Luke","mistake":"","id":"vs-34","g":["preceptor|preceptor|receptor|perceptor|precept","results|result","okay|\\bok\\b|alright|all right"]},{"n":35,"kind":"partner","who":"RN","words":"Okay, just talk me through what you’ve done so far.","scene":"Report and leave him safe","id":"vs-35","audio":"vs-35"},{"n":36,"kind":"say","title":"Report every value WITH its normal range","scene":"Report and leave him safe","do":"Date and time on the chart, then each value, normal or abnormal, and the normal adult range for EACH one. Mention how you counted (30 seconds × 2).","words":"I put the date and the time in 24-hour time. His temperature was 36.9, within the normal range of 36.5 to 37.5. His pulse was 64; normal is 60 to 100. I counted for 30 seconds and doubled it. His respiratory rate was 12; normal is 12 to 20. His blood pressure was 110 over 60; normal systolic is 110 to 140 and diastolic 60 to 90, so he’s on the low side of normal.","to":"the RN","mistake":"The rubric wants the normal adult range for ALL the vital signs, not just the abnormal one.","id":"vs-36","g":["24-hour|24.?hour|twenty.?four","36.5|36 point 5|thirty.?six point five","37.5|37 point 5|thirty.?seven point five","60 to 100|60-100|sixty to (a )?hundred","12 to 20|12-20|twelve to twenty","110 to 140|110-140|one ten to one forty","60 to 90|60-90|sixty to ninety","30 seconds|thirty seconds|doubled"],"trap":"Ranges for ALL of them"},{"n":37,"kind":"partner","who":"RN","words":"What’s your responsibility as a student if any of those were outside the normal range, too high or too low?","scene":"Report and leave him safe","id":"vs-37","audio":"vs-37"},{"n":38,"kind":"say","title":"Answer: recheck it and report it straight away","scene":"Report and leave him safe","do":"Recheck it, then report it to your preceptor/RN straight away. Never sit on an abnormal value.","words":"I’d recheck it, and I’d always report it to you straight away if anything was outside the normal range. I’d also explain it to him, and make sure he’s safe.","to":"the RN","mistake":"","id":"vs-38","g":["recheck|re-check|re check|check it again","report","straight away|right away|immediately","explain","safe"]},{"n":39,"kind":"say","title":"Close the loop with him","scene":"Report and leave him safe","do":"Tell him you’re finished and when you’ll be back.","words":"John, that concludes your vital signs for today. I’ll come back and check on you in about half an hour.","to":"Mr Luke","mistake":"","id":"vs-39","g":["concludes|conclude|finished|all done","half an hour|30 minutes|thirty minutes|come back"]},{"n":40,"kind":"say","title":"Leave him safe: call bell, water, comfortable","scene":"Report and leave him safe","do":"Call bell in his hand or within reach · water within reach · ask: sitting up or back to bed? · take away anything extra (pillow) · brakes on.","words":"If you need anything, here’s your call bell. Just give that a ring. Are you fine sitting up for now, or would you like to go back to bed? Your water’s here.","to":"Mr Luke","mistake":"","id":"vs-40","g":["call bell|bell","sitting|bed","water"]},{"n":41,"kind":"say","title":"Thank him","scene":"Report and leave him safe","do":"","words":"Well, thank you very much, and we’ll see you in half an hour.","to":"Mr Luke","mistake":"","id":"vs-41","g":["thank"]},{"n":42,"kind":"act","title":"Clean the equipment and put it back","scene":"Report and leave him safe","do":"Wipe the cuff, the stethoscope (chest piece and earpieces) and the thermometer, then return them.","words":"","to":"","mistake":"","id":"vs-42","g":["wiping|wipe|wip|clean","cuff|stethoscope|thermometer"],"say":"Wiping the cuff, stethoscope and thermometer, and putting them back."},{"n":43,"kind":"act","title":"Hand hygiene","scene":"Report and leave him safe","do":"Sanitise or wash your hands. Last step, every time.","words":"","to":"","mistake":"","id":"vs-43","g":["sanitising|sanitis|sanitiz|hand|wash"],"say":"I’m sanitising my hands."},{"n":44,"kind":"act","title":"Check the chart is complete","scene":"Report and leave him safe","do":"Date and 24-hour time · every value plotted · blue/black pen · any error crossed out with ONE line so it can still be read.","words":"","to":"","mistake":"","id":"vs-44","g":["date","24-hour|24.?hour|twenty.?four|time","plotted|plot|value|pen"],"say":"Chart check: date, 24-hour time, every value plotted, black pen."}]},"para":{"label":"Med admin · Paracetamol","steps":[{"n":1,"kind":"say","title":"Hand hygiene","scene":"With your RN, before the bedside","do":"Clean hands before you touch the chart or the medicines. The drug room is used by every nurse.","words":"Can I wash my hands first?","to":"","mistake":"","id":"ma-1","g":["wash|sanitis|sanitiz|hand"]},{"n":2,"kind":"say","title":"Read the chart out loud, finger on it","scene":"With your RN, before the bedside","do":"Patient sticker: name, NHI, date of birth. The prescriber has also written his name by hand. Use your index finger so your RN can follow.","words":"This is the chart for John Luke, NHI D G Y 2963, date of birth 16th of December 1942. The sticker’s here and the prescriber has written his name and NHI by hand.","to":"the RN","mistake":"No name on the chart means no drug. Joan: “no giving drugs to naked charts”.","id":"ma-2","g":["Luke","NHI|n h i|2963|dgy|d g y","date of birth|birth|1942","sticker|label","by hand|hand.?written|written"]},{"n":3,"kind":"say","title":"Allergies & Adverse Reactions box (the yellow one)","scene":"With your RN, before the bedside","do":"Read it out: ticked “No”, signed and dated by the prescriber. That only means he was ASKED. You still ask him yourself at the bedside.","words":"Allergies and adverse reactions: ticked no, signed and dated by the prescriber. I’ll still check with him at the bedside.","to":"the RN","mistake":"","id":"ma-3","g":["Allergies|allerg","adverse|reaction","signed|dated","bedside|still check|check with him"]},{"n":4,"kind":"say","title":"Special care + supplementary charts","scene":"With your RN, before the bedside","do":"Special Care Required (renal or hepatic impairment, pregnancy, breastfeeding, anticoagulation) and supplementary charts (insulin, heparin, warfarin). Say what’s ticked.","words":"No special care boxes ticked and no supplementary charts.","to":"the RN","mistake":"","id":"ma-4","g":["special care","supplementary"]},{"n":5,"kind":"say","title":"Find the order: drug, dose, route, frequency, signed","scene":"With your RN, before the bedside","do":"Regular page: the date, the GENERIC name, dose AND units, route, frequency, prescriber’s signature (it matches the sample signatures on the front page).","words":"On the regular page it’s dated and signed: Paracetamol 1 g PO qid.","to":"the RN","mistake":"","id":"para-5","g":["regular","dated|signed","Paracetamol|paracetamol|para","1 g|1g|1 gram|one gram|1000","\\bPO\\b|p o|by mouth|oral","qid|q i d|four times|4 times"]},{"n":6,"kind":"say","title":"Right time: when was the last dose?","scene":"With your RN, before the bedside","do":"Look across the administration record: is it due NOW, and when was the last dose given? At least 4 hours since the last dose, and no more than 4 g in 24 hours. 1 g qid is already 4 g a day, so ANY other paracetamol (Panadol from home, cold-and-flu products) would be too much.","words":"It’s prescribed four times a day (qid). Looking at the administration record, the last dose was ___, so it’s due now.","to":"the RN","mistake":"","id":"para-6","g":["four times|4 times|qid|q i d","last dose","due"]},{"n":7,"kind":"partner","who":"RN","words":"So can you tell me a little bit about this drug?","scene":"With your RN, before the bedside","id":"ma-7","audio":"ma-7"},{"n":8,"kind":"say","title":"Knowledge: generic name, why HE’s on it, side effects","scene":"With your RN, before the bedside","do":"Technical words are fine with the RN. Generic name · drug class · indication FOR MR LUKE · common adverse effects · one nursing consideration.","words":"Paracetamol is a simple analgesic. He’s on it for his recurrent backache. Common adverse effects are actually none at the right dose. The Medsafe data sheet lists every one as very rare: allergic reactions and rash, bronchospasm in people sensitive to aspirin, low platelets, and liver problems. The main danger is liver damage from too much. I’ll check it’s been at least 4 hours since his last dose and that he hasn’t had other paracetamol, because the max is 4 grams a day.","to":"the RN","mistake":"The indication has to be about HIM (“his backache” or “his blood pressure”), not a textbook list.","id":"para-8","g":["analgesic","backache|back pain|back","very rare|rare|none","allergic|allerg|rash","bronchospasm|broncho|bronchial spasm","platelets|platelet","liver","4 hours|four hours","4 grams|4 g|4g|four grams"],"trap":"ALL the common AEs"},{"n":9,"kind":"say","title":"Select the pack: label vs chart (check 1)","scene":"With your RN, before the bedside","do":"Read the label: generic name and strength against the chart. Work out how many: two 500 mg tablets.","words":"The label says paracetamol 500 mg tablets. It’s prescribed 1 g, so that’s two 500 mg tablets.","to":"the RN","mistake":"","id":"para-9","g":["label","500","two|2 tablets|\\b2\\b"]},{"n":10,"kind":"say","title":"Read the expiry date out loud AND interpret it","scene":"With your RN, before the bedside","do":"Say the date, then say what it means. “07/2027” = good until the END of July 2027. Repackaged with only a dispensing date = no more than 12 months from dispensing.","words":"It expires the end of July 2027, so it’s in date.","to":"the RN","mistake":"“Check AND interpret.” Reading the date isn’t enough. Say whether it’s in date.","id":"ma-10","g":["expires|expir","end of","in date|indate|in-date"],"trap":"Read it AND interpret it"},{"n":11,"kind":"say","title":"Pop it into the cup, no touching (checks 2 and 3)","scene":"With your RN, before the bedside","do":"Push the tablet(s) from the blister straight into the medicine cup. Don’t touch them. Check the label against the chart again, and once more before putting the pack away. Get a glass of water.","words":"I’m not touching the tablet, just popping it out into the cup. And a glass of water.","to":"","mistake":"","id":"ma-11","g":["not touching|don.?t touch|without touching|touching","cup","water"]},{"n":12,"kind":"act","title":"Knock, and hand hygiene on the way in","scene":"At the bedside","do":"Knock. Clean hands before you touch him or his things.","words":"","to":"","mistake":"","id":"ma-12","g":["Knock|knock","sanitising|sanitis|sanitiz|hand|wash"],"say":"Knock knock. I’m sanitising my hands on the way in."},{"n":13,"kind":"say","title":"Greet + introduce you AND your RN (AI2DET)","scene":"At the bedside","do":"Acknowledge him, Introduce yourself and your RN, say what you’ve brought.","words":"Good morning Mr Luke. My name’s ___, I’m a student nurse from MIT, and this is my preceptor ___, who I’m working with today. I’ve got your paracetamol, which is a new medicine for you, I believe.","to":"Mr Luke","mistake":"","id":"para-13","g":["morning|hello|kia ora|\\bhi\\b","student","preceptor|receptor|perceptor|precept","paracetamol|para","new medicine|new"]},{"n":14,"kind":"say","title":"ID: he says name + DOB, you check the band + NHI","scene":"At the bedside","do":"He TELLS you his full name and date of birth. You read the wristband (name, DOB, NHI) against the chart.","words":"Can I just check I’ve got the right person? Can you tell me your full name and date of birth? And can I have a little look at your wristband?","to":"Mr Luke","mistake":"","id":"ma-14","g":["full name","date of birth|birth","wristband|wrist band|\\bband"]},{"n":15,"kind":"partner","who":"Mr Luke","words":"John Luke. Sixteenth of December, 1942.","scene":"At the bedside","id":"ma-15","audio":"ma-15"},{"n":16,"kind":"say","title":"Ask about allergies AND bad reactions","scene":"At the bedside","do":"The chart was checked. Now ask HIM: every time, every drug.","words":"Are you allergic to anything that you know of? And have you had a bad reaction to any medicines before?","to":"Mr Luke","mistake":"Chart AND verbal. A tick on the chart doesn’t replace asking him.","id":"ma-16","g":["allergic|allerg","reaction"],"trap":"Chart AND verbal"},{"n":17,"kind":"partner","who":"Mr Luke","words":"No, not that I know of.","scene":"At the bedside","id":"ma-17","audio":"ma-17"},{"n":18,"kind":"say","title":"ASK: what does he already know?","scene":"At the bedside","do":"An open question about what he knows. No yes/no questions.","words":"Have you heard of paracetamol before? What do you know about it?","to":"Mr Luke","mistake":"","id":"para-18","g":["heard of","know about|what do you know"]},{"n":19,"kind":"partner","who":"Mr Luke","words":"No, I don’t think so. The doctor just said it was a new one.","scene":"At the bedside","id":"ma-19","audio":"ma-19"},{"n":20,"kind":"say","title":"BUILD: what it’s for, how to take it, side effects, what to do","scene":"At the bedside","do":"PLAIN words, no jargon. What it’s for (for the backache you’ve been getting). How to take it. The common side effects and what to DO about them. Pause and let him think.","words":"This is paracetamol. It’s for the backache you’ve been getting. Most people get no side effects from paracetamol. If you get a rash, swelling, or trouble breathing, ring your bell straight away. The main thing is never to take more than you’re given, because too much can harm your liver.","to":"Mr Luke","mistake":"Joan’s RN stopped the student at “resistance”: say it in words he’d use.","id":"para-20","g":["backache|back pain|back","side effects|side effect","rash","swelling|swell","trouble breathing|breathing|breath","bell","liver"]},{"n":21,"kind":"say","title":"CHECK: teach-back in his own words","scene":"At the bedside","do":"Not “Do you understand?” Ask him to tell you back. If he misses a bit, prompt kindly and re-explain. It’s on you, not him.","words":"I want to check I’ve been clear. Can you tell me, in your own words, what this tablet is for, and what you’d do if you got a rash or felt unwell?","to":"Mr Luke","mistake":"","id":"para-21","g":["own words","rash|unwell"]},{"n":22,"kind":"partner","who":"Mr Luke","words":"It’s for my back pain, and if I get a rash or feel funny I ring the bell. And I don’t take any of my own Panadol.","scene":"At the bedside","id":"para-22","audio":"para-22"},{"n":23,"kind":"say","title":"Consent + questions (right to refuse)","scene":"At the bedside","do":"A real choice. Then invite questions.","words":"Are you happy to take it? Have you got any questions?","to":"Mr Luke","mistake":"","id":"ma-23","g":["happy","questions|question"]},{"n":24,"kind":"partner","who":"Mr Luke","words":"Sure, that was pretty clear. Thank you.","scene":"At the bedside","id":"ma-24","audio":"ma-24"},{"n":25,"kind":"act","title":"Give it: sitting up, with water, watch it go down","scene":"At the bedside","do":"Sitting upright. Hand him the cup and the water. Swallow with a glass of water. Stay until it’s swallowed. Never leave it on the table.","words":"","to":"","mistake":"","id":"para-25","g":["Sitting|sit|upright","water","swallow"],"say":"Sitting you up. Here’s your water, and I’ll stay while you swallow it."},{"n":26,"kind":"say","title":"One practical tip for home","scene":"At the bedside","do":"Joan’s student added routine and refills: the same time each day, and get a repeat before you run out.","words":"It’s best to take it at the same time each day. And when you get down to about a week’s supply, ask your GP for a repeat, so you don’t run out.","to":"Mr Luke","mistake":"","id":"ma-26","g":["same time","repeat|refill","week"]},{"n":27,"kind":"say","title":"Leave him safe: call bell, thank him","scene":"At the bedside","do":"Call bell within reach. If dizziness is a risk, ask him to ring before getting up. Thank him.","words":"Here’s your call bell. If you want to get up in the next hour or so, give it a ring first so one of us can be with you. Thank you, Mr Luke.","to":"Mr Luke","mistake":"","id":"ma-27","g":["call bell|bell","get up|ring","Thank|thank"]},{"n":28,"kind":"act","title":"Hand hygiene","scene":"At the bedside","do":"On the way out.","words":"","to":"","mistake":"","id":"ma-28","g":["sanitising|sanitis|sanitiz|hand|wash"],"say":"I’m sanitising my hands on the way out."},{"n":29,"kind":"act","title":"Sign it on the chart: date, time, dose, Giv/Chck","scene":"Document and debrief","do":"In the administration record for THIS drug: date · time (24-hour) · dose WITH units (1 g, never a bare number) · your initials in Giv, your RN’s in Chck. Only AFTER he’s taken it.","words":"","to":"","mistake":"Never sign before it’s given. And “1” or “47.5” alone is wrong. Write the unit.","id":"para-29","g":["date","24-hour|24.?hour|twenty.?four|time","1 g|1g|1 gram|one gram|unit","initials|initial"],"say":"Signing now he’s taken it: date, 24-hour time, 1 g with the unit, my initials in Giv, yours in Chck.","trap":"Unit on the dose"},{"n":30,"kind":"partner","who":"RN","words":"Can you describe to me how you used the three steps of patient education just now?","scene":"Document and debrief","id":"ma-30","audio":"ma-30"},{"n":31,"kind":"say","title":"Describe Ask, Build, Check to the RN","scene":"Document and debrief","do":"Name each step and what YOU did in it.","words":"First I ASKED what he already knew about paracetamol. Then I BUILT on that: I explained what it’s for and the side effects in plain words. Then I CHECKED he understood by asking him to tell me back in his own words.","to":"the RN","mistake":"","id":"para-31","g":["ASKED|asked|ask","BUILT|built|build","CHECKED|checked|check","own words"]},{"n":32,"kind":"say","title":"Thank your RN","scene":"Document and debrief","do":"","words":"Thank you.","to":"the RN","mistake":"","id":"ma-32","g":["Thank|thank"]}]},"meto":{"label":"Med admin · Metoprolol","steps":[{"n":1,"kind":"say","title":"Hand hygiene","scene":"With your RN, before the bedside","do":"Clean hands before you touch the chart or the medicines. The drug room is used by every nurse.","words":"Can I wash my hands first?","to":"","mistake":"","id":"ma-1","g":["wash|sanitis|sanitiz|hand"]},{"n":2,"kind":"say","title":"Read the chart out loud, finger on it","scene":"With your RN, before the bedside","do":"Patient sticker: name, NHI, date of birth. The prescriber has also written his name by hand. Use your index finger so your RN can follow.","words":"This is the chart for John Luke, NHI D G Y 2963, date of birth 16th of December 1942. The sticker’s here and the prescriber has written his name and NHI by hand.","to":"the RN","mistake":"No name on the chart means no drug. Joan: “no giving drugs to naked charts”.","id":"ma-2","g":["Luke","NHI|n h i|2963|dgy|d g y","date of birth|birth|1942","sticker|label","by hand|hand.?written|written"]},{"n":3,"kind":"say","title":"Allergies & Adverse Reactions box (the yellow one)","scene":"With your RN, before the bedside","do":"Read it out: ticked “No”, signed and dated by the prescriber. That only means he was ASKED. You still ask him yourself at the bedside.","words":"Allergies and adverse reactions: ticked no, signed and dated by the prescriber. I’ll still check with him at the bedside.","to":"the RN","mistake":"","id":"ma-3","g":["Allergies|allerg","adverse|reaction","signed|dated","bedside|still check|check with him"]},{"n":4,"kind":"say","title":"Special care + supplementary charts","scene":"With your RN, before the bedside","do":"Special Care Required (renal or hepatic impairment, pregnancy, breastfeeding, anticoagulation) and supplementary charts (insulin, heparin, warfarin). Say what’s ticked.","words":"No special care boxes ticked and no supplementary charts.","to":"the RN","mistake":"","id":"ma-4","g":["special care","supplementary"]},{"n":5,"kind":"say","title":"Find the order: drug, dose, route, frequency, signed","scene":"With your RN, before the bedside","do":"Regular page: the date, the GENERIC name, dose AND units, route, frequency, prescriber’s signature (it matches the sample signatures on the front page).","words":"On the regular page it’s dated and signed: Metoprolol Succinate CR 47.5 mg PO daily.","to":"the RN","mistake":"","id":"meto-5","g":["regular","dated|signed","Metoprolol|metoprolol|metropolol|meto|metro","Succinate|succinate|succ|suck|sux","47.5 mg|47.5|47 point 5|forty.?seven point five","\\bPO\\b|p o|by mouth|oral","daily|once a day"]},{"n":6,"kind":"say","title":"Right time: when was the last dose?","scene":"With your RN, before the bedside","do":"Look across the administration record: is it due NOW, and when was the last dose given? Once a day only. Check the administration record that today’s dose hasn’t already been given.","words":"It’s prescribed once daily. Looking at the administration record, the last dose was ___, so it’s due now.","to":"the RN","mistake":"","id":"meto-6","g":["once daily|once a day|daily","last dose","due"]},{"n":7,"kind":"partner","who":"RN","words":"So can you tell me a little bit about this drug?","scene":"With your RN, before the bedside","id":"ma-7","audio":"ma-7"},{"n":8,"kind":"say","title":"Knowledge: generic name, why HE’s on it, side effects","scene":"With your RN, before the bedside","do":"Technical words are fine with the RN. Generic name · drug class · indication FOR MR LUKE · common adverse effects · one nursing consideration.","words":"Metoprolol succinate is a beta-adrenoceptor blocker. He’s on it for his high blood pressure and his heart failure. Common adverse effects are fatigue, which is very common, and the common ones: bradycardia, postural dizziness, cold hands and feet, palpitations, dizziness, headache, nausea, abdominal pain, diarrhoea, constipation, and dyspnoea on exertion. I’ll check his pulse and blood pressure first, and he’s a falls risk because of the dizziness.","to":"the RN","mistake":"The indication has to be about HIM (“his backache” or “his blood pressure”), not a textbook list.","id":"meto-8","g":["beta|blocker","blood pressure|hypertension","heart failure","fatigue|tired","bradycardia|slow heart","postural|posture|standing","cold hands|cold","palpitations|palpitation","dizziness|dizz","headache","nausea|nauseous","abdominal pain|abdominal|tummy|stomach","diarrhoea|diarr","constipation|constipat","dyspnoea|dyspn|disp|short of breath|breathless","pulse|heart rate","falls risk|falls|fall"],"trap":"ALL the common AEs"},{"n":9,"kind":"say","title":"Select the pack: label vs chart (check 1)","scene":"With your RN, before the bedside","do":"Read the label: generic name and strength against the chart. Work out how many: one 47.5 mg CR tablet.","words":"The label says metoprolol succinate CR 47.5 mg. It’s prescribed 47.5 mg, so that’s one 47.5 mg CR tablet.","to":"the RN","mistake":"","id":"meto-9","g":["label","47.5|47 point 5|forty.?seven point five","one|1 tablet|\\b1\\b|CR|controlled"]},{"n":10,"kind":"say","title":"Read the expiry date out loud AND interpret it","scene":"With your RN, before the bedside","do":"Say the date, then say what it means. “07/2027” = good until the END of July 2027. Repackaged with only a dispensing date = no more than 12 months from dispensing.","words":"It expires the end of July 2027, so it’s in date.","to":"the RN","mistake":"“Check AND interpret.” Reading the date isn’t enough. Say whether it’s in date.","id":"ma-10","g":["expires|expir","end of","in date|indate|in-date"],"trap":"Read it AND interpret it"},{"n":11,"kind":"say","title":"Pop it into the cup, no touching (checks 2 and 3)","scene":"With your RN, before the bedside","do":"Push the tablet(s) from the blister straight into the medicine cup. Don’t touch them. Check the label against the chart again, and once more before putting the pack away. Get a glass of water.","words":"I’m not touching the tablet, just popping it out into the cup. And a glass of water.","to":"","mistake":"","id":"ma-11","g":["not touching|don.?t touch|without touching|touching","cup","water"]},{"n":12,"kind":"act","title":"Knock, and hand hygiene on the way in","scene":"At the bedside","do":"Knock. Clean hands before you touch him or his things.","words":"","to":"","mistake":"","id":"ma-12","g":["Knock|knock","sanitising|sanitis|sanitiz|hand|wash"],"say":"Knock knock. I’m sanitising my hands on the way in."},{"n":13,"kind":"say","title":"Greet + introduce you AND your RN (AI2DET)","scene":"At the bedside","do":"Acknowledge him, Introduce yourself and your RN, say what you’ve brought.","words":"Good morning Mr Luke. My name’s ___, I’m a student nurse from MIT, and this is my preceptor ___, who I’m working with today. I’ve got your metoprolol succinate, which is a new medicine for you, I believe.","to":"Mr Luke","mistake":"","id":"meto-13","g":["morning|hello|kia ora|\\bhi\\b","student","preceptor|receptor|perceptor|precept","metoprolol|metropolol|meto|metro","new medicine|new"]},{"n":14,"kind":"say","title":"ID: he says name + DOB, you check the band + NHI","scene":"At the bedside","do":"He TELLS you his full name and date of birth. You read the wristband (name, DOB, NHI) against the chart.","words":"Can I just check I’ve got the right person? Can you tell me your full name and date of birth? And can I have a little look at your wristband?","to":"Mr Luke","mistake":"","id":"ma-14","g":["full name","date of birth|birth","wristband|wrist band|\\bband"]},{"n":15,"kind":"partner","who":"Mr Luke","words":"John Luke. Sixteenth of December, 1942.","scene":"At the bedside","id":"ma-15","audio":"ma-15"},{"n":16,"kind":"say","title":"Ask about allergies AND bad reactions","scene":"At the bedside","do":"The chart was checked. Now ask HIM: every time, every drug.","words":"Are you allergic to anything that you know of? And have you had a bad reaction to any medicines before?","to":"Mr Luke","mistake":"Chart AND verbal. A tick on the chart doesn’t replace asking him.","id":"ma-16","g":["allergic|allerg","reaction"],"trap":"Chart AND verbal"},{"n":17,"kind":"partner","who":"Mr Luke","words":"No, not that I know of.","scene":"At the bedside","id":"ma-17","audio":"ma-17"},{"n":18,"kind":"say","title":"ASK: what does he already know?","scene":"At the bedside","do":"An open question about what he knows. No yes/no questions.","words":"Have you heard of metoprolol succinate before? What do you know about it?","to":"Mr Luke","mistake":"","id":"meto-18","g":["heard of","know about|what do you know"]},{"n":19,"kind":"partner","who":"Mr Luke","words":"No, I don’t think so. The doctor just said it was a new one.","scene":"At the bedside","id":"ma-19","audio":"ma-19"},{"n":20,"kind":"say","title":"BUILD: what it’s for, how to take it, side effects, what to do","scene":"At the bedside","do":"PLAIN words, no jargon. What it’s for (to bring your blood pressure down and take some of the strain off your heart). How to take it. The common side effects and what to DO about them. Pause and let him think.","words":"This is metoprolol succinate. It’s to bring your blood pressure down and take some of the strain off your heart. The common side effects are feeling tired; a slow heartbeat, or feeling your heart pounding; feeling dizzy or light-headed, especially when you stand up; cold hands and feet; headaches; feeling sick, tummy pain, diarrhoea or constipation; and getting short of breath when you're active. Because of the dizziness, please ring your bell before you get up for the next little while, so we can help you and you don't fall. As with any new medicine, if your lips feel tingly, your throat feels tight, it’s hard to breathe, or you get an itchy rash, ring your bell straight away.","to":"Mr Luke","mistake":"Joan’s RN stopped the student at “resistance”: say it in words he’d use.","id":"meto-20","g":["blood pressure","heart","tired|fatigue","slow heartbeat|slow","pounding","dizzy|light.?headed","stand up|stand","cold hands|cold","headaches|headache","feeling sick|sick|nause","tummy pain|tummy|stomach|abdominal","diarrhoea|diarr","constipation|constipat","short of breath|breath","bell","tingly|tingl","throat","itchy|itch"]},{"n":21,"kind":"say","title":"CHECK: teach-back in his own words","scene":"At the bedside","do":"Not “Do you understand?” Ask him to tell you back. If he misses a bit, prompt kindly and re-explain. It’s on you, not him.","words":"I want to check I’ve been clear. Can you tell me, in your own words, what this tablet is for, and what you’d do if you felt dizzy?","to":"Mr Luke","mistake":"","id":"meto-21","g":["own words","dizzy"]},{"n":22,"kind":"partner","who":"Mr Luke","words":"It’s for my blood pressure and my heart, and if I feel dizzy I ring the bell before I get up.","scene":"At the bedside","id":"meto-22","audio":"meto-22"},{"n":23,"kind":"say","title":"Consent + questions (right to refuse)","scene":"At the bedside","do":"A real choice. Then invite questions.","words":"Are you happy to take it? Have you got any questions?","to":"Mr Luke","mistake":"","id":"ma-23","g":["happy","questions|question"]},{"n":24,"kind":"partner","who":"Mr Luke","words":"Sure, that was pretty clear. Thank you.","scene":"At the bedside","id":"ma-24","audio":"ma-24"},{"n":25,"kind":"act","title":"Give it: sitting up, with water, watch it go down","scene":"At the bedside","do":"Sitting upright. Hand him the cup and the water. Swallow it whole with a glass of water. Don’t crush or chew it. Stay until it’s swallowed. Never leave it on the table.","words":"","to":"","mistake":"","id":"meto-25","g":["Sitting|sit|upright","water","whole|crush|chew"],"say":"Sitting you up. Swallow it whole with the water, don’t crush or chew it. I’ll stay while you swallow it."},{"n":26,"kind":"say","title":"One practical tip for home","scene":"At the bedside","do":"Joan’s student added routine and refills: the same time each day, and get a repeat before you run out.","word  explained what it’s for and the side effects in plain words. Then I CHECKED he understood by asking him to tell me back in his own words.","to":"the RN","mistake":"","id":"meto-31","g":["ASKED|asked|ask","BUILT|built|build","CHECKED|checked|check","own words"]},{"n":32,"kind":"say","title":"Thank your RN","scene":"Document and debrief","do":"","words":"Thank you.","to":"the RN","mistake":"","id":"ma-32","g":["Thank|thank"]}]}},"forks":[{"cue":"The practical starts. You’re at the chart with your preceptor.","vs":[0,1],"ma":[0,1]},{"cue":"You’re at the bedside. Your first words to Mr Luke.","vs":[4,5],"ma":[12,13]},{"cue":"Mr Luke has just told you his name and date of birth.","vs":[9,10],"ma":[15,16]},{"cue":"You’ve just finished explaining to Mr Luke.","vs":[13,14],"ma":[20,21]},{"cue":"The RN asks you a question.","vs":[37,38],"ma":[30,31]},{"cue":"You’ve just sanitised your hands near the end.","vs":[43,44],"ma":[28,29]}]};</script>
